[project]
name = "synapse-backend"
version = "0.1.0"
description = "SynapseCME backend — FastAPI + GraphRAG agent over local QVAC inference"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "neo4j>=5.25",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "websockets>=13",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
